[Contacts]
# 触点稳定性：放宽后不再频繁判丢（解决手势时好时坏）
SizeThresholdMin = 0.01
SizeThresholdMax = 10.0
PositionThresholdMin = 0.001
PositionThresholdMax = 20.0
OrientationThresholdMin = 0.1
OrientationThresholdMax = 180

# 轻触灵敏度：越小越灵敏（本机实测值，可按手感 ±1 微调）
SizeMin = 0.13
ActivationThreshold = 18
DeactivationThreshold = 15

[Touchscreen]
# 笔在屏幕附近时忽略手指，写字不误触；只影响手指，不影响笔
DisableOnStylus = true
